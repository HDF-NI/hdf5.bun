name: Test hdf5.bun

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  HDF5_VERSION: "1.14.6"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache the compiled core HDF5 AND the plugin libraries
      - name: Cache HDF5 Library & Plugins
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/hdf5-install
          key: ${{ matrix.os }}-hdf5-with-lz4-${{ env.HDF5_VERSION }}

      # Compile HDF5 core and LZ4 Plugin if cache misses
      # Using native build flags to ensure plugins link to the correct root binaries
      - name: Compile HDF5 from Source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        run: |
          mkdir -p hdf5-build
          cd hdf5-build
          
          # 1. Fetch and compile HDF5 Core
          curl -L "https://github.com/HDFGroup/hdf5/releases/download/hdf5_${{ env.HDF5_VERSION }}/hdf5-${{ env.HDF5_VERSION }}.tar.gz" -o hdf5-${{ env.HDF5_VERSION }}.tar.gz
          tar -xzf hdf5-${{ env.HDF5_VERSION }}.tar.gz
          cd hdf5-${{ env.HDF5_VERSION }}
          
          ./configure --prefix=${{ github.workspace }}/hdf5-install --enable-shared --disable-static
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install
          cd ../..

          # 2. Conquer the CMake Plugin Nightmare (LZ4 Support)
          # We clone the official HDFGroup plugin repo and build LZ4 specifically
          curl -L "https://github.com/HDFGroup/hdf5_plugins/releases/download/hdf5-1.14.6/hdf5_plugins-1.14.tar.gz" -o hdf5_plugins-1.14.tar.gz
          tar -xzf hdf5_plugins-1.14.tar.gz
          pwd
          mkdir -p hdf5_plugins-1.14/build
          cd hdf5_plugins-1.14
          echo
          ls -lastr
          ls -lastr ..
          # Explicitly bind the newly compiled HDF5_ROOT so CMake behaves
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DH5PL_SOURCE_DIR="$PWD" \
                -DHDF5_ROOT=${{ github.workspace }}/hdf5-install \
                -DENABLE_LZ4=ON \
                -DENABLE_BZIP2=OFF \
                -DENABLE_BLOSC=OFF \
                -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/hdf5-install/lib/plugin 
                
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      # Expose paths dynamically so Bun FFI and the HDF5 internal engine work together
      - name: Set Environment Paths
        run: |
          echo "HDF5_ROOT=${{ github.workspace }}/hdf5-install" >> $GITHUB_ENV
          echo "HDF5_PLUGIN_PATH=${{ github.workspace }}/hdf5-install/lib/plugin" >> $GITHUB_ENV
          echo "HDF5_DATA_DIR=${{ github.workspace }}/examples" >> $GITHUB_ENV
          
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/hdf5-install/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          else
            echo "LD_LIBRARY_PATH=${{ github.workspace }}/hdf5-install/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
